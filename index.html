<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK4 汉语学习小队 - Quản Lý Nhóm Học Tiếng Trung (1 GV + 4 HV)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
              800: '#9f1239',
              900: '#881337',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col antialiased selection:bg-rose-500 selection:text-white">

  <!-- TOP APP HEADER -->
  <header class="sticky top-0 z-40 glass-header border-b border-slate-200/80 transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20 gap-4">
        
        <!-- Logo & Tên nhóm học -->
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-rose-600 to-amber-700 flex items-center justify-center text-white shadow-lg shadow-rose-200 ring-2 ring-white">
            <span class="font-hanzi font-black text-xl tracking-tighter">中文</span>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-black text-slate-900 text-lg sm:text-xl tracking-tight">HSK 4 冲刺班</span>
              <span class="seal-badge px-2 py-0.5 text-[10px]">1 GV + 4 HV</span>
            </div>
            <p class="text-xs text-slate-500 font-medium">Hệ Thống Quản Lý Lịch Học & Nộp Bài Google Drive</p>
          </div>
        </div>

        <!-- Role Switcher (Chuyển đổi góc nhìn Cô giáo / 4 Học sinh) -->
        <div id="header-user-switcher" class="flex-shrink-0">
          <!-- Render tự động bởi app.js -->
        </div>

      </div>

      <!-- Navigation Tabs -->
      <nav id="main-tabs-nav" class="flex items-center gap-2 pb-3 pt-1 overflow-x-auto no-scrollbar">
        <!-- Render tự động bởi app.js -->
      </nav>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="tab-content-container">
      <!-- Nội dung tab hiện tại được render động bởi js/app.js -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="mt-auto border-t border-slate-200 bg-white py-6 text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
      <div class="flex items-center gap-2">
        <span class="font-hanzi font-bold text-rose-700 text-sm">好好学习，天天向上！</span>
        <span class="text-slate-400">|</span>
        <span>Nhóm học tiếng Trung HSK 4 - 1 Giáo viên & 4 Học viên</span>
      </div>
      <div class="flex items-center gap-4 font-medium">
        <a href="#drive" onclick="switchTab('drive')" class="hover:text-blue-600 transition">Cấu hình Google Drive</a>
        <a href="https://drive.google.com" target="_blank" class="hover:text-blue-600 transition flex items-center gap-1">
          <i data-lucide="external-link" class="w-3 h-3"></i> Google Drive
        </a>
      </div>
    </div>
  </footer>

  <!-- MODAL CONTAINER (Nơi chèn các form Popup) -->
  <div id="modal-container"></div>

  <!-- TOAST CONTAINER (Thông báo nổi góc dưới bên phải) -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2.5 max-w-md pointer-events-none"></div>

  <!-- CORE SCRIPTS -->
  <script src="data/initialData.js"></script>
  <script src="js/drive-service.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
